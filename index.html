  <style>
    :root {
      --bg-1: #dfe9f3;
      --bg-2: #c9d9ea;
      --card: #ffffff;
      --text: #0b1f33;
      --muted: #5b6b7c;
      --accent: #2f5b95;
      --accent-hover: #264c7e;
      --border: #e3e9ef;
      --dot: rgba(11, 31, 51, .07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #0d1a27;
        --bg-2: #13263a;
        --card: #182a3d;
        --text: #f1f5f9;
        --muted: #9fb0c2;
        --accent: #4a8fd6;
        --accent-hover: #5c9ee3;
        --border: #24394f;
        --dot: rgba(255, 255, 255, .05);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(var(--dot) 1.2px, transparent 1.2px) 0 0 / 22px 22px,
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12vh 16px 48px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(11, 31, 51, .12), 0 2px 8px rgba(11, 31, 51, .06);
      animation: rise .5s ease-out both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .avatar {
      width: 132px; height: 132px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 20px;
      box-shadow: 0 0 0 4px var(--card), 0 0 0 6px var(--border);
    }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
    .handle { color: var(--muted); font-size: 16px; margin-top: 6px; }
    .bio { font-size: 17px; line-height: 1.5; margin: 18px auto 28px; max-width: 320px; }
    .actions { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      height: 52px; border-radius: 999px;
      font-weight: 600; font-size: 16px; text-decoration: none;
      transition: background .15s, transform .15s, border-color .15s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { border: 1.5px solid var(--border); color: var(--text); }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .meta { margin-top: 24px; font-size: 13px; color: var(--muted); }
  </style>
</head>
